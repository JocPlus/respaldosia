<h1>Política de privacidad</h1>
<p>RespaldosIA solo la usa su autor, con su propia cuenta de Google. Accede únicamente a los archivos de Google Drive que la propia aplicación crea (permiso <code>drive.file</code>), y los respaldos se suben cifrados.</p>
<p>No recopila, comparte ni vende datos de terceros.</p>
